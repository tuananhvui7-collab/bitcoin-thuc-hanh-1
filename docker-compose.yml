version: "3.9"

services:
  bitcoind:
    image: bitcoin/bitcoin:28.0
    container_name: btc-regtest-node
    command:
      - -regtest=1
      - -server=1
      - -rpcuser=${RPC_USER:-dev}
      - -rpcpassword=${RPC_PASSWORD:-devpass}
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -txindex=1
      - -fallbackfee=0.0002
      - -printtoconsole
    ports:
      - "18443:18443"   # cổng RPC mặc định của regtest
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin
    networks:
      - btc-lab

  app:
    build:
      context: ./src
    container_name: btc-lab-app
    depends_on:
      - bitcoind
    env_file:
      - .env
    environment:
      - RPC_HOST=bitcoind        # tên service, KHÔNG dùng 127.0.0.1 trong container
      - RPC_PORT=18443
      - RPC_USER=${RPC_USER:-dev}
      - RPC_PASSWORD=${RPC_PASSWORD:-devpass}
    ports:
      - "5000:5000"
    networks:
      - btc-lab

networks:
  btc-lab:

volumes:
  bitcoin-data:
