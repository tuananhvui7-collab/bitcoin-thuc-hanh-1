<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regtest Web Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .btc-icon { color: #f7931a; }
        .addr-box { background-color: #2a2a2a; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 0.85rem; word-break: break-all; }
        .table-dark { --bs-table-bg: #1e1e1e; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-wallet2 btc-icon me-2"></i>Regtest Wallet</a>
            <div class="d-flex align-items-center">
                <select class="form-select bg-dark text-light border-secondary me-2" id="wallet-selector" style="width: auto;">
                    <option value="" selected disabled>-- Chọn Ví Đăng Nhập --</option>
                    <option value="cSmKSQgPLqn9jSt89KjbhTiBpT7qK4jWrdQnmgMzHPuhZvVbp82V">Ví Test 1 (Alice)</option>
                    <option value="cUi51ejxfidY9JMwFg8orA1zFFhHCwyGtsKcb42gaTPRScGrVNGJ">Ví Test 2 (Bob)</option>
                </select>
                <button class="btn btn-outline-info btn-sm me-2" id="btn-custom-wif">Dùng WIF Khác</button>
                <button class="btn btn-outline-success btn-sm me-3" id="btn-create-wallet">Tạo Ví Mới</button>
                <button class="btn btn-warning btn-sm" id="btn-mine" title="Đóng Block xác nhận giao dịch trên mạng Regtest" style="display: none;">
                    <i class="bi bi-pickaxe"></i> Miner: Đóng Block
                </button>
            </div>
        </div>
    </nav>

    <!-- Màn hình chờ Đăng nhập -->
    <div class="container text-center mt-5" id="login-prompt">
        <i class="bi bi-shield-lock text-muted" style="font-size: 5rem;"></i>
        <h4 class="mt-3 text-muted">Vui lòng chọn ví ở Menu phía trên để đăng nhập</h4>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="container" id="main-dashboard" style="display: none;">
        <div class="row g-4 mb-4">
            
            <!-- THÔNG TIN VÍ -->
            <div class="col-md-5">
                <div class="card h-100 shadow-sm border-info">
                    <div class="card-header border-bottom border-secondary pt-3">
                        <h5 class="card-title text-info"><i class="bi bi-person-badge"></i> Ví Của Tôi</h5>
                    </div>
                    <div class="card-body">
                        <h2 class="mb-4 text-center"><span id="my-balance">0.00000000</span> <small class="text-muted fs-6">BTC</small></h2>
                        <h6 class="text-muted mb-3 border-bottom border-secondary pb-2">Địa chỉ nhận tiền (Tự động cấp):</h6>
                        <div class="mb-2">
                            <span class="badge text-bg-warning">Legacy</span>
                            <div class="addr-box mt-1 text-warning" id="addr-legacy">...</div>
                        </div>
                        <div class="mb-2">
                            <span class="badge text-bg-primary">Native Segwit</span>
                            <div class="addr-box mt-1 text-primary" id="addr-native">...</div>
                        </div>
                        <div>
                            <span class="badge text-bg-success">Taproot</span>
                            <div class="addr-box mt-1 text-success" id="addr-taproot">...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FORM GỬI TIỀN -->
            <div class="col-md-7">
                <div class="card shadow-sm h-100">
                    <div class="card-header border-bottom border-secondary pt-3">
                        <h5 class="card-title"><i class="bi bi-send"></i> Chuyển Tiền</h5>
                    </div>
                    <div class="card-body">
                        <form id="transfer-form">
                            <div class="mb-3">
                                <label class="form-label text-muted">Địa chỉ người nhận</label>
                                <input type="text" class="form-control bg-dark text-light border-secondary" id="recipient-addr" placeholder="Nhập địa chỉ Legacy, Segwit hoặc Taproot..." required>
                            </div>
                            <div class="row mb-4">
                                <div class="col-md-7">
                                    <label class="form-label text-muted">Số tiền gửi (BTC)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-dark text-light border-secondary"><i class="bi bi-currency-bitcoin"></i></span>
                                        <input type="number" step="0.00000001" class="form-control bg-dark text-light border-secondary" id="amount" placeholder="0.0" required>
                                    </div>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label text-muted">Phí thợ đào (BTC)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-dark text-light border-secondary"><i class="bi bi-currency-bitcoin"></i></span>
                                        <input type="number" step="0.00000001" class="form-control bg-dark text-light border-secondary" id="fee-btc" value="0.00001" required>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fs-5" id="btn-transfer">
                                Khởi tạo & Phát sóng Giao Dịch
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            
        </div>
        
        <!-- SỔ CÁI (LEDGER) -->
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header border-bottom border-secondary pt-3">
                        <h5 class="card-title"><i class="bi bi-list-columns-reverse"></i> Lịch Sử Giao Dịch (Sổ Cái)</h5>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-dark table-hover mb-0" id="ledger-table">
                            <thead>
                                <tr>
                                    <th>Thời gian</th>
                                    <th>Gửi đến</th>
                                    <th>Số lượng (BTC)</th>
                                    <th>Phí (BTC)</th>
                                    <th>Trạng thái</th>
                                    <th>TXID</th>
                                </tr>
                            </thead>
                            <tbody id="ledger-body">
                                <tr><td colspan="6" class="text-center text-muted py-3">Chưa có giao dịch nào</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toast-body">Thông báo</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
